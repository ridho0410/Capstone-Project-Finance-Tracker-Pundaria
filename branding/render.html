<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pundaria logo render</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070b11; }
    body.cream { background: #fbf6ea; }
    img { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  </style>
</head>
<body>
  <img id="logo" alt="Pundaria logo" />
  <script>
    const params = new URLSearchParams(location.search);
    const n = params.get('logo') || '1';
    document.getElementById('logo').src = 'pundaria-logo-' + n + '.svg';
    if (n === '3') document.body.classList.add('cream');
  </script>
</body>
</html>
